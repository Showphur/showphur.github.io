[project]
name = "machineplay"
version = "0.1.0"
description = "Cumulative culture across generations of agents that never meet: chemistry, inscription stones, and executable slates."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
machineplay = "machineplay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["machineplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
